<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 汉语拼音大冒险 ⚡</title>
    <style>
        /* 缤纷可爱 cool 风格设计 */
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f0fdf4; /* 温和的浅绿色背景 */
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            color: #333;
        }

        /* 左侧导航栏 */
        .sidebar {
            width: 280px;
            background-color: #ffffff;
            box-shadow: 2px 0 12px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            border-right: 4px solid #bbf7d0;
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-size: 20px;
            color: #16a34a;
            text-align: center;
            margin-bottom: 10px;
        }

        .menu-btn {
            background-color: #f3f4f6;
            border: 2px solid #e5e7eb;
            padding: 15px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            color: #4b5563;
        }

        .menu-btn:hover {
            background-color: #dcfce7;
            border-color: #4ade80;
            color: #15803d;
        }

        .menu-btn.active {
            background-color: #4ade80;
            border-color: #16a34a;
            color: white;
        }

        /* 右侧主要练习区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            padding: 40px;
            position: relative;
            box-sizing: border-box;
        }

        .game-container {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 600px;
            width: 100%;
            border: 4px solid #bbf7d0;
            box-sizing: border-box;
        }

        .score-board {
            font-size: 18px;
            font-weight: bold;
            color: #16a34a;
            margin-bottom: 15px;
        }

        .mode-title {
            font-size: 18px;
            color: #666;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* 特定声母、韵母练习的选择区 */
        .sub-menu-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .sub-btn {
            background-color: #ffffff;
            border: 3px solid #cbd5e1;
            padding: 12px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: #334155;
            line-height: 1.4;
        }

        .sub-btn:hover, .sub-btn.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
            color: #1d4ed8;
        }

        .word-display {
            font-size: 72px;
            font-weight: bold;
            color: #1e293b;
            margin: 20px 0;
            letter-spacing: 4px;
        }

        .input-box {
            font-size: 26px;
            padding: 12px 20px;
            width: 80%;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            outline: none;
            text-align: center;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .input-box:focus {
            border-color: #4ade80;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.2);
        }

        /* 答题反馈泡泡 */
        .feedback {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 45px;
            padding: 5px 10px;
            line-height: 35px;
            border-radius: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .correct { 
            color: #15803d; 
            background-color: #dcfce7; 
        }

        .wrong { 
            color: #b91c1c; 
            background-color: #fee2e2; 
        }

        .hidden { 
            display: none !important; 
        }
    </style>
</head>
<body>

    <!-- 左侧导航栏 -->
    <div class="sidebar">
        <h2>拼音冒险岛</h2>
        <button class="menu-btn active" onclick="switchMode(1)">随机拼字练习<br>(无声调)</button>
        <button class="menu-btn" onclick="switchMode(2)">随机拼字练习<br>(加入声调)</button>
        <button class="menu-btn" onclick="switchMode(3)">特定声母、韵母练习</button>
        <button class="menu-btn" onclick="switchMode(4)">错题本<br>(加强练习)</button>
    </div>

    <!-- 右侧内容区 -->
    <div class="main-content">
        <!-- 模式三的 6 大分类子菜单 -->
        <div id="sub-menu" class="sub-menu-container hidden">
            <button class="sub-btn active" onclick="switchSubCategory('sh聲母')">23个声母 :<br>b p m f d t n l g k h j q x zh ch sh r z c s y w</button>
            <button class="sub-btn" onclick="switchSubCategory('dan韻母')">6个单韵母 :<br>a o e i u ü</button>
            <button class="sub-btn" onclick="switchSubCategory('fu韻母')">9个复韵母 :<br>ai ei ui ao ou iu ie üe er</button>
            <button class="sub-btn" onclick="switchSubCategory('qianBi韻母')">5个前鼻韵母 :<br>an en in un ün</button>
            <button class="sub-btn" onclick="switchSubCategory('houBi韻母')">4个后鼻韵母 :<br>ang eng ing ong</button>
            <button class="sub-btn" onclick="switchSubCategory('zhi整体')">16个整体认读音节 :<br>zhi chi shi ri zi ci si yi wu yu ye yue yuan yin yun ying</button>
        </div>

        <!-- 游戏核心卡片 -->
        <div class="game-container" id="game-card">
            <div class="score-board">⭐ 已挑战：<span id="score">0</span> 题</div>
            <div class="mode-title" id="current-mode-name">随机拼字练习（无声调）</div>
            
            <!-- 出题字 -->
            <div class="word-display" id="word-target">你好</div>
            
            <!-- 输入框 -->
            <input type="text" id="pinyin-input" class="input-box" placeholder="在这里输入拼音..." autocomplete="off" autofocus>
            
            <!-- 结果回馈 -->
            <div id="feedback" class="feedback"></div>
        </div>
    </div>

<script>
    // 1. 全局词库与分类数据
    const wordBank = [
        { word: "你好", noTone: "nihao", withTone: "ni3hao3" },
        { word: "谢谢", noTone: "xiexie", withTone: "xie4xie" },
        { word: "老师", noTone: "laoshi", withTone: "lao3shi1" },
        { word: "学生", noTone: "xuesheng", withTone: "xue2sheng" },
        { word: "学校", noTone: "xuexiao", withTone: "xue2xiao4" },
        { word: "电脑", noTone: "diannao", withTone: "dian4nao3" },
        { word: "高兴", noTone: "gaoxing", withTone: "gao1xing4" },
        { word: "朋友", noTone: "pengyou", withTone: "peng2you" },
        { word: "苹果", noTone: "pingguo", withTone: "ping2guo3" },
        { word: "喜欢", noTone: "xihuan", withTone: "xi3huan" }
    ];

    const categoryBank = {
        "sh聲母": [
            { word: "爸", ans: "b" }, { word: "妈", ans: "m" }, { word: "大", ans: "d" }, { word: "土", ans: "t" },
            { word: "足", ans: "z" }, { word: "出", ans: "ch" }, { word: "鱼", ans: "y" }, { word: "我", ans: "w" }
        ],
        "dan韻母": [
            { word: "啊", ans: "a" }, { word: "喔", ans: "o" }, { word: "鹅", ans: "e" }, 
            { word: "衣", ans: "i" }, { word: "乌", ans: "u" }, { word: "迂", ans: "u" }
        ],
        "fu韻母": [
            { word: "爱", ans: "ai" }, { word: "诶", ans: "ei" }, { word: "威", ans: "ui" }, { word: "熬", ans: "ao" },
            { word: "欧", ans: "ou" }, { word: "优", ans: "iu" }, { word: "椰", ans: "ie" }, { word: "约", ans: "ue" }, { word: "耳", ans: "er" }
        ],
        "qianBi韻母": [
            { word: "安", ans: "an" }, { word: "恩", ans: "en" }, { word: "因", ans: "in" }, { word: "温", ans: "un" }, { word: "晕", ans: "un" }
        ],
        "houBi韻母": [
            { word: "昂", ans: "ang" }, { word: "亨", ans: "eng" }, { word: "英", ans: "ing" }, { word: "轰", ans: "ong" }
        ],
        "zhi整体": [
            { word: "织", ans: "zhi" }, { word: "吃", ans: "chi" }, { word: "狮", ans: "shi" }, { word: "日", ans: "ri" },
            { word: "字", ans: "zi" }, { word: "词", ans: "ci" }, { word: "丝", ans: "si" }, { word: "医", ans: "yi" },
            { word: "巫", ans: "wu" }, { word: "淤", ans: "yu" }, { word: "夜", ans: "ye" }, { word: "月", ans: "yue" },
            { word: "圆", ans: "yuan" }, { word: "音", ans: "yin" }, { word: "云", ans: "yun" }, { word: "影", ans: "ying" }
        ]
    };

    // 状态变量
    let currentMode = 1; 
    let currentSubCategory = "sh聲母";
    let currentQuestion = {};
    let score = 0;
    let wrongList = []; // 错题本库
    let wrongCount = 0;  // 当前题目连续答错次数计数器

    // DOM 元素
    const modeTitleEl = document.getElementById('current-mode-name');
    const wordTargetEl = document.getElementById('word-target');
    const inputEl = document.getElementById('pinyin-input');
    const feedbackEl = document.getElementById('feedback');
    const scoreEl = document.getElementById('score');
    const subMenuEl = document.getElementById('sub-menu');

    // 2. 模式切换
    function switchMode(modeNum) {
        currentMode = modeNum;
        
        // 更新左侧按钮高亮
        const buttons = document.querySelectorAll('.menu-btn');
        buttons.forEach((btn, idx) => {
            if (idx === modeNum - 1) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        // 控制模式三子菜单显示
        if (modeNum === 3) {
            subMenuEl.classList.remove('hidden');
        } else {
            subMenuEl.classList.add('hidden');
        }

        // 更新标题与出题
        if (modeNum === 1) modeTitleEl.innerText = "随机拼字练习（无声调）";
        if (modeNum === 2) modeTitleEl.innerText = "随机拼字练习（加入声调，例: ni3hao3）";
        if (modeNum === 3) modeTitleEl.innerText = "特定声母、韵母练习";
        if (modeNum === 4) modeTitleEl.innerText = "错题本（加强练习）";

        nextQuestion();
    }

    // 模式三专属：切换子分类
    function switchSubCategory(catName) {
        currentSubCategory = catName;
        const subBtns = document.querySelectorAll('.sub-btn');
        subBtns.forEach(btn => {
            if ((catName==='sh聲母' && btn.innerText.includes('23个声母')) || 
                (catName==='dan韻母' && btn.innerText.includes('6个单韵母')) || 
                (catName==='fu韻母' && btn.innerText.includes('9个复韵母')) || 
                (catName==='qianBi韻母' && btn.innerText.includes('5个前鼻韵母')) || 
                (catName==='houBi韻母' && btn.innerText.includes('4个后鼻韵母')) || 
                (catName==='zhi整体' && btn.innerText.includes('16个整体认读'))) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        nextQuestion();
    }

    // 3. 出题逻辑
    function nextQuestion() {
        // 重置状态
        wrongCount = 0;
        inputEl.value = '';
        inputEl.disabled = false;
        feedbackEl.className = 'feedback';
        feedbackEl.innerText = '';

        if (currentMode === 1 || currentMode === 2) {
            const r = Math.floor(Math.random() * wordBank.length);
            const q = wordBank[r];
            currentQuestion = {
                word: q.word,
                answer: currentMode === 1 ? q.noTone : q.withTone
            };
        } else if (currentMode === 3) {
            const list = categoryBank[currentSubCategory];
            const r = Math.floor(Math.random() * list.length);
            const q = list[r];
            currentQuestion = { word: q.word, answer: q.ans };
        } else if (currentMode === 4) {
            if (wrongList.length === 0) {
                wordTargetEl.innerText = "🎉";
                feedbackEl.className = "feedback correct";
                feedbackEl.innerText = "目前没有错题记录，太棒了！";
                inputEl.value = "";
                inputEl.disabled = true;
                return;
            }
            const r = Math.floor(Math.random() * wrongList.length);
            currentQuestion = Object.assign({}, wrongList[r]);
        }

        wordTargetEl.innerText = currentQuestion.word;
        inputEl.focus();
    }

    // 4. 输入判定逻辑（按 Enter 判定）
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const userInput = inputEl.value.toLowerCase().trim();
            const targetAnswer = currentQuestion.answer;

            if (userInput === targetAnswer) {
                // 答对了
                feedbackEl.className = 'feedback correct';
                feedbackEl.innerText = '🎉 太棒了！答对啰！';
                score++;
                scoreEl.innerText = score;

                // 如果在错题本里答对，就从错题本移出
                if (currentMode === 4) {
                    wrongList = wrongList.filter(item => !(item.word === currentQuestion.word && item.answer === currentQuestion.answer));
                }
                
                inputEl.disabled = true; // 答对后暂停输入
                setTimeout(nextQuestion, 1000);
            } else {
                // 答错了，增加错误计数
                wrongCount++;
                inputEl.value = ''; // 自动清空输入框方便再次输入

                if (wrongCount < 3) {
                    // 答错第 1、2 次：不给答案，只提示再试一次
                    feedbackEl.className = 'feedback wrong';
                    feedbackEl.innerText = `❌ 答错啰 (${wrongCount}/3 次)，再试一次看看！`;
                } else {
                    // 答错第 3 次：显示答案、加入错题本，并跳下一题
                    feedbackEl.className = 'feedback wrong';
                    feedbackEl.innerText = `💡 答错 3 次啰！正确答案是: ${targetAnswer}`;
                    inputEl.disabled = true; // 暂停输入

                    // 放入错题本（如果不是在错题本模式下，且尚未存在）
                    const alreadyIn = wrongList.some(item => item.word === currentQuestion.word && item.answer === targetAnswer);
                    if (!alreadyIn && currentMode !== 4) {
                        wrongList.push({ word: currentQuestion.word, answer: targetAnswer });
                    }

                    // 留 2.5 秒给学生看正确答案后自动跳下一题
                    setTimeout(nextQuestion, 2500);
                }
            }
        }
    });

    // 页面初始化
    nextQuestion();
</script>
</body>
</html>
