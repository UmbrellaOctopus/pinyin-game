<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 汉语拼音大冒险 ⚡</title>
    <style>
        /* 缤纷可爱 cool 风格设计 */
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f0fdf4; /* 温和的浅绿色背景 */
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            color: #333;
        }

        /* 左侧导航栏 */
        .sidebar {
            width: 280px;
            background-color: #ffffff;
            box-shadow: 2px 0 12px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            border-right: 4px solid #bbf7d0;
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-size: 20px;
            color: #16a34a;
            text-align: center;
            margin-bottom: 10px;
        }

        .menu-btn {
            background-color: #f3f4f6;
            border: 2px solid #e5e7eb;
            padding: 15px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            color: #4b5563;
        }

        .menu-btn:hover {
            background-color: #dcfce7;
            border-color: #4ade80;
            color: #15803d;
        }

        .menu-btn.active {
            background-color: #4ade80;
            border-color: #16a34a;
            color: white;
        }

        /* 右侧主要练习区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            padding: 40px;
            position: relative;
            box-sizing: border-box;
        }

        .game-container {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 600px;
            width: 100%;
            border: 4px solid #bbf7d0;
            box-sizing: border-box;
        }

        .score-board {
            font-size: 18px;
            font-weight: bold;
            color: #16a34a;
            margin-bottom: 15px;
        }

        .mode-title {
            font-size: 18px;
            color: #666;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* 特定声母、韵母练习的选择区 */
        .sub-menu-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .sub-btn {
            background-color: #ffffff;
            border: 3px solid #cbd5e1;
            padding: 12px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: #334155;
            line-height: 1.4;
        }

        .sub-btn:hover, .sub-btn.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
            color: #1d4ed8;
        }

        .word-display {
            font-size: 64px;
            font-weight: bold;
            color: #1e293b;
            margin: 20px 0;
            letter-spacing: 4px;
        }

        .input-box {
            font-size: 26px;
            padding: 12px 20px;
            width: 80%;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            outline: none;
            text-align: center;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .input-box:focus {
            border-color: #4ade80;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.2);
        }

        /* 答题反馈泡泡 */
        .feedback {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 45px;
            padding: 8px 12px;
            line-height: 35px;
            border-radius: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
        }

        .correct { 
            color: #15803d; 
            background-color: #dcfce7; 
        }

        .wrong { 
            color: #b91c1c; 
            background-color: #fee2e2; 
        }

        /* 按钮通用样式 */
        .action-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #16a34a;
        }

        .action-btn.secondary {
            background-color: #64748b;
        }

        .action-btn.secondary:hover {
            background-color: #475569;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .hidden { 
            display: none !important; 
        }
    </style>
    <!-- 引入 pinyin-pro 用于自动将文本转换成带声调/不带声调的拼音 -->
    <script src="https://unpkg.com/pinyin-pro@3.18.3/dist/index.js"></script>
</head>
<body>

    <!-- 左侧导航栏 -->
    <div class="sidebar">
        <h2>拼音冒险岛</h2>
        <button class="menu-btn active" onclick="switchMode(1)">随机拼字练习<br>(无声调)</button>
        <button class="menu-btn" onclick="switchMode(2)">随机拼字练习<br>(加入声调)</button>
        <button class="menu-btn" onclick="switchMode(3)">特定声母、韵母练习</button>
        <button class="menu-btn" onclick="switchMode(4)">错题本<br>(加强练习)</button>
    </div>

    <!-- 右侧内容区 -->
    <div class="main-content">
        <!-- 模式三的 6 大分类子菜单 -->
        <div id="sub-menu" class="sub-menu-container hidden">
            <button class="sub-btn active" onclick="switchSubCategory('sh聲母')">23个声母 :<br>b p m f d t n l g k h j q x zh ch sh r z c s y w</button>
            <button class="sub-btn" onclick="switchSubCategory('dan韻母')">6个单韵母 :<br>a o e i u ü</button>
            <button class="sub-btn" onclick="switchSubCategory('fu韻母')">9个复韵母 :<br>ai ei ui ao ou iu ie üe er</button>
            <button class="sub-btn" onclick="switchSubCategory('qianBi韻母')">5个前鼻韵母 :<br>an en in un ün</button>
            <button class="sub-btn" onclick="switchSubCategory('houBi韻母')">4个后鼻韵母 :<br>ang eng ing ong</button>
            <button class="sub-btn" onclick="switchSubCategory('zhi整体')">16个整体认读音节 :<br>zhi chi shi ri zi ci si yi wu yu ye yue yuan yin yun ying</button>
        </div>

        <!-- 游戏核心卡片 -->
        <div class="game-container" id="game-card">
            <!-- 答题进行中界面 -->
            <div id="quiz-box">
                <div class="score-board">🚩 进度：第 <span id="current-index">1</span> / 20 题 | 正确：<span id="score">0</span> 题</div>
                <div class="mode-title" id="current-mode-name">随机拼字练习（无声调）</div>
                
                <!-- 出题字 -->
                <div class="word-display" id="word-target">眼睛</div>
                
                <!-- 输入框 -->
                <input type="text" id="pinyin-input" class="input-box" placeholder="在这里输入拼音..." autocomplete="off" autofocus>
                
                <!-- 结果回馈 -->
                <div id="feedback" class="feedback"></div>
            </div>

            <!-- 20 题挑战结束结算界面 -->
            <div id="result-box" class="hidden">
                <h2 style="font-size: 28px; color: #16a34a; margin-bottom: 10px;">🏆 挑战完成！</h2>
                <div style="font-size: 22px; font-weight: bold; margin: 20px 0; color: #334155;">
                    本次成绩：<span id="final-score" style="color: #2563eb; font-size: 32px;">0/20</span>
                </div>
                <p style="font-size: 18px; color: #475569; margin-bottom: 20px;">是否要继续挑战下一轮？</p>
                <div class="btn-group">
                    <button class="action-btn" onclick="restartChallenge()">是 (继续挑战)</button>
                    <button class="action-btn secondary" onclick="goHome()">否 (返回主页)</button>
                </div>
            </div>
        </div>
    </div>

    const categoryBank = {
        "sh聲母": [
            { word: "爸", ans: "b" }, { word: "妈", ans: "m" }, { word: "大", ans: "d" }, { word: "土", ans: "t" },
            { word: "足", ans: "z" }, { word: "出", ans: "ch" }, { word: "鱼", ans: "y" }, { word: "我", ans: "w" }
        ],
        "dan韻母": [
            { word: "啊", ans: "a" }, { word: "喔", ans: "o" }, { word: "鹅", ans: "e" }, 
            { word: "衣", ans: "i" }, { word: "乌", ans: "u" }, { word: "迂", ans: "u" }
        ],
        "fu韻母": [
            { word: "爱", ans: "ai" }, { word: "诶", ans: "ei" }, { word: "威", ans: "ui" }, { word: "熬", ans: "ao" },
            { word: "欧", ans: "ou" }, { word: "优", ans: "iu" }, { word: "椰", ans: "ie" }, { word: "约", ans: "ue" }, { word: "耳", ans: "er" }
        ],
        "qianBi韻母": [
            { word: "安", ans: "an" }, { word: "恩", ans: "en" }, { word: "因", ans: "in" }, { word: "温", ans: "un" }, { word: "晕", ans: "un" }
        ],
        "houBi韻母": [
            { word: "昂", ans: "ang" }, { word: "亨", ans: "eng" }, { word: "英", ans: "ing" }, { word: "轰", ans: "ong" }
        ],
        "zhi整体": [
            { word: "织", ans: "zhi" }, { word: "吃", ans: "chi" }, { word: "shi", ans: "shi" }, { word: "日", ans: "ri" },
            { word: "字", ans: "zi" }, { word: "词", ans: "ci" }, { word: "丝", ans: "si" }, { word: "医", ans: "yi" },
            { word: "巫", ans: "wu" }, { word: "淤", ans: "yu" }, { word: "夜", ans: "ye" }, { word: "月", ans: "yue" },
            { word: "圆", ans: "yuan" }, { word: "音", ans: "yin" }, { word: "云", ans: "yun" }, { word: "影", ans: "ying" }
        ]
    };

    // 状态变量
    let currentMode = 1; 
    let currentSubCategory = "sh聲母";
    let currentQuestion = {};
    let score = 0;              // 当前答对题数
    let totalAsked = 0;         // 当前已出的题数（上限 20）
    let wrongList = [];         // 错题本库
    let wrongCount = 0;         // 当前题目连续答错次数

    // DOM 元素
    const modeTitleEl = document.getElementById('current-mode-name');
    const wordTargetEl = document.getElementById('word-target');
    const inputEl = document.getElementById('pinyin-input');
    const feedbackEl = document.getElementById('feedback');
    const scoreEl = document.getElementById('score');
    const currentIndexEl = document.getElementById('current-index');
    const subMenuEl = document.getElementById('sub-menu');
    const quizBoxEl = document.getElementById('quiz-box');
    const resultBoxEl = document.getElementById('result-box');
    const finalScoreEl = document.getElementById('final-score');

    // 拼音转换工具
    function getPinyin(word, withTone) {
        if (typeof pinyinPro !== 'undefined') {
            if (withTone) {
                return pinyinPro.pinyin(word, { toneType: 'num', type: 'array' }).join('');
            } else {
                return pinyinPro.pinyin(word, { toneType: 'none', type: 'array' }).join('');
            }
        }
        return "";
    }

    // 重置 20 题局数
    function resetChallenge() {
        score = 0;
        totalAsked = 0;
        scoreEl.innerText = score;
        quizBoxEl.classList.remove('hidden');
        resultBoxEl.classList.add('hidden');
    }

    // 切换模式
    function switchMode(modeNum) {
        currentMode = modeNum;
        
        const buttons = document.querySelectorAll('.menu-btn');
        buttons.forEach((btn, idx) => {
            if (idx === modeNum - 1) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        if (modeNum === 3) {
            subMenuEl.classList.remove('hidden');
        } else {
            subMenuEl.classList.add('hidden');
        }

        if (modeNum === 1) modeTitleEl.innerText = "随机拼字练习（无声调）";
        if (modeNum === 2) modeTitleEl.innerText = "随机拼字练习（加入声调，例: ni3hao3）";
        if (modeNum === 3) modeTitleEl.innerText = "特定声母、韵母练习";
        if (modeNum === 4) modeTitleEl.innerText = "错题本（加强练习）";

        resetChallenge();
        nextQuestion();
    }

    // 切换子分类
    function switchSubCategory(catName) {
        currentSubCategory = catName;
        const subBtns = document.querySelectorAll('.sub-btn');
        subBtns.forEach(btn => {
            if ((catName==='sh聲母' && btn.innerText.includes('23个声母')) || 
                (catName==='dan韻母' && btn.innerText.includes('6个单韵母')) || 
                (catName==='fu韻母' && btn.innerText.includes('9个复韵母')) || 
                (catName==='qianBi韻母' && btn.innerText.includes('5个前鼻韵母')) || 
                (catName==='houBi韻母' && btn.innerText.includes('4个后鼻韵母')) || 
                (catName==='zhi整体' && btn.innerText.includes('16个整体认读'))) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        resetChallenge();
        nextQuestion();
    }

    // 出题逻辑
    function nextQuestion() {
        // 判断是否已完成 20 题
        if (totalAsked >= 20) {
            showResult();
            return;
        }

        totalAsked++;
        currentIndexEl.innerText = totalAsked;
        wrongCount = 0;
        inputEl.value = '';
        inputEl.disabled = false;
        feedbackEl.className = 'feedback';
        feedbackEl.innerHTML = '';

        if (currentMode === 1 || currentMode === 2) {
            const r = Math.floor(Math.random() * customWordList.length);
            const targetWord = customWordList[r];
            const pinyinAns = getPinyin(targetWord, currentMode === 2);
            currentQuestion = { word: targetWord, answer: pinyinAns };
        } else if (currentMode === 3) {
            const list = categoryBank[currentSubCategory];
            const r = Math.floor(Math.random() * list.length);
            const q = list[r];
            currentQuestion = { word: q.word, answer: q.ans };
        } else if (currentMode === 4) {
            if (wrongList.length === 0) {
                wordTargetEl.innerText = "🎉";
                feedbackEl.className = "feedback correct";
                feedbackEl.innerText = "目前没有错题记录，太棒了！";
                inputEl.value = "";
                inputEl.disabled = true;
                return;
            }
            const r = Math.floor(Math.random() * wrongList.length);
            currentQuestion = Object.assign({}, wrongList[r]);
        }

        wordTargetEl.innerText = currentQuestion.word;
        inputEl.focus();
    }

    // 显示 20 题结算结果
    function showResult() {
        quizBoxEl.classList.add('hidden');
        resultBoxEl.classList.remove('hidden');
        finalScoreEl.innerText = `${score}/20`;
    }

    // 结算画面选择：“是”（重新开始挑战）
    function restartChallenge() {
        resetChallenge();
        nextQuestion();
    }

    // 结算画面选择：“否”（返回主页模式 1）
    function goHome() {
        switchMode(1);
    }

    // 输入判定（按 Enter 判定）
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const userInput = inputEl.value.toLowerCase().trim();
            const targetAnswer = currentQuestion.answer.toLowerCase().trim();

            if (userInput === targetAnswer) {
                // 答对了
                feedbackEl.className = 'feedback correct';
                feedbackEl.innerText = '🎉 太棒了！答对啰！';
                score++;
                scoreEl.innerText = score;

                if (currentMode === 4) {
                    wrongList = wrongList.filter(item => !(item.word === currentQuestion.word && item.answer === currentQuestion.answer));
                }
                
                inputEl.disabled = true;
                setTimeout(nextQuestion, 1000);
            } else {
                // 答错了
                wrongCount++;
                inputEl.value = '';

                if (wrongCount < 3) {
                    feedbackEl.className = 'feedback wrong';
                    feedbackEl.innerText = `❌ 答错啰 (${wrongCount}/3 次)，再试一次看看！`;
                } else {
                    // 答错第 3 次：显示正确答案，并提供“继续挑战”按钮让学生自由停留
                    feedbackEl.className = 'feedback wrong';
                    feedbackEl.innerHTML = `
                        <div>💡 答错 3 次啰！正确答案是: <strong>${targetAnswer}</strong></div>
                        <button class="action-btn" style="margin-top:8px;" onclick="nextQuestion()">继续挑战 ➔</button>
                    `;
                    inputEl.disabled = true;

                    // 加入错题本
                    const alreadyIn = wrongList.some(item => item.word === currentQuestion.word && item.answer === targetAnswer);
                    if (!alreadyIn && currentMode !== 4) {
                        wrongList.push({ word: currentQuestion.word, answer: targetAnswer });
                    }
                }
            }
        }
    });

    // 页面初始化
    nextQuestion();
</script>
