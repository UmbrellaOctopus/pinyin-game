<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 汉语拼音大冒险 ⚡</title>
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f0fdf4;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            color: #333;
        }

        /* 左侧导航栏 */
        .sidebar {
            width: 300px;
            background-color: #ffffff;
            box-shadow: 2px 0 12px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 10px;
            border-right: 4px solid #bbf7d0;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 20px;
            color: #16a34a;
            text-align: center;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .menu-btn {
            background-color: #f3f4f6;
            border: 2px solid #e5e7eb;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            color: #4b5563;
        }

        .menu-btn:hover {
            background-color: #dcfce7;
            border-color: #4ade80;
            color: #15803d;
        }

        .menu-btn.active {
            background-color: #4ade80;
            border-color: #16a34a;
            color: white;
        }

        /* 年级子菜单容器 */
        .grade-menu-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 12px;
            border-left: 3px solid #cbd5e1;
            margin-bottom: 5px;
        }

        .grade-btn {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            color: #334155;
        }

        .grade-btn:hover, .grade-btn.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
            color: #1d4ed8;
        }

        /* 右侧主要练习区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            padding: 40px;
            position: relative;
            box-sizing: border-box;
        }

        .game-container {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 650px;
            width: 100%;
            border: 4px solid #bbf7d0;
            box-sizing: border-box;
        }

        .home-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .home-title {
            font-size: 32px;
            color: #15803d;
            font-weight: bold;
            margin: 0;
        }

        .home-subtitle {
            font-size: 20px;
            color: #334155;
            line-height: 1.6;
            margin: 0;
        }

        .dragon-img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            margin: 10px 0;
        }

        .start-btn {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s;
        }

        .start-btn:hover {
            background-color: #d97706;
            transform: scale(1.05);
        }

        .score-board {
            font-size: 18px;
            font-weight: bold;
            color: #16a34a;
            margin-bottom: 15px;
        }

        .mode-title {
            font-size: 18px;
            color: #666;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .sub-menu-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
        }

        .sub-btn {
            background-color: #ffffff;
            border: 3px solid #cbd5e1;
            padding: 12px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: #334155;
            line-height: 1.4;
        }

        .sub-btn:hover, .sub-btn.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
            color: #1d4ed8;
        }

        .word-display-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .word-display {
            font-size: 56px;
            font-weight: bold;
            color: #1e293b;
            letter-spacing: 2px;
        }

        .audio-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
        }

        .audio-btn:hover {
            background-color: #0369a1;
            transform: scale(1.1);
        }

        .input-box {
            font-size: 26px;
            padding: 12px 20px;
            width: 80%;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            outline: none;
            text-align: center;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .input-box:focus {
            border-color: #4ade80;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.2);
        }

        .feedback {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 45px;
            padding: 8px 12px;
            line-height: 1.5;
            border-radius: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
        }

        .correct { 
            color: #15803d; 
            background-color: #dcfce7; 
        }

        .wrong { 
            color: #b91c1c; 
            background-color: #fee2e2; 
        }

        .analysis-box {
            background-color: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .analysis-item {
            font-size: 16px;
            color: #334155;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        .analysis-tag {
            font-weight: bold;
            color: #dc2626;
        }

        .custom-input-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            margin-top: 15px;
        }

        .custom-textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }

        .action-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #16a34a;
        }

        .action-btn.secondary {
            background-color: #64748b;
        }

        .action-btn.secondary:hover {
            background-color: #475569;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .hidden { 
            display: none !important; 
        }
    </style>
    <script src="https://unpkg.com/pinyin-pro@3.18.3/dist/index.js"></script>
</head>
<body>

    <!-- 左侧导航栏 -->
    <div class="sidebar">
        <h2 onclick="goHome()">🐉 拼音冒险岛</h2>
        
        <!-- 年级选择主菜单按钮 -->
        <button class="menu-btn" onclick="toggleGradeMenu()">📚 年级选择 ▾</button>
        
        <!-- 年级子选单列表 -->
        <div id="grade-sub-menu" class="grade-menu-container hidden">
            <button class="grade-btn" onclick="selectGrade('G1')">一年级 (G1)</button>
            <button class="grade-btn" onclick="selectGrade('G2')">二年级 (G2)</button>
            <button class="grade-btn" onclick="selectGrade('G3')">三年级 (G3)</button>
            <button class="grade-btn" onclick="selectGrade('G4')">四年级 (G4)</button>
            <button class="grade-btn" onclick="selectGrade('G5')">五年级 (G5)</button>
            <button class="grade-btn" onclick="selectGrade('WLP_初级')">WLP初级</button>
            <button class="grade-btn" onclick="selectGrade('WLP_中级')">WLP中级</button>
            <button class="grade-btn" onclick="selectGrade('WLP_高级')">WLP高级</button>
        </div>

        <button class="menu-btn" onclick="switchMode(1)">随机拼字练习<br>(无声调)</button>
        <button class="menu-btn" onclick="switchMode(2)">随机拼字练习<br>(加入声调)</button>
        <button class="menu-btn" onclick="switchMode(3)">特定声母、韵母练习</button>
        <button class="menu-btn" onclick="switchMode(5)">📝 自订字词练习<br>(家长/老师特训)</button>
        <button class="menu-btn" onclick="switchMode(4)">错题本<br>(加强练习)</button>
    </div>

    <!-- 右侧内容区 -->
    <div class="main-content">
        <!-- 模式三的 6 大分类子菜单 -->
        <div id="sub-menu" class="sub-menu-container hidden">
            <button class="sub-btn active" onclick="switchSubCategory('sh聲母')">23个声母 :<br>b p m f d t n l g k h j q x zh ch sh r z c s y w</button>
            <button class="sub-btn" onclick="switchSubCategory('dan韻母')">6个单韵母 :<br>a o e i u ü</button>
            <button class="sub-btn" onclick="switchSubCategory('fu韻母')">9个复韵母 :<br>ai ei ui ao ou iu ie üe er</button>
            <button class="sub-btn" onclick="switchSubCategory('qianBi韻母')">5个前鼻韵母 :<br>an en in un ün</button>
            <button class="sub-btn" onclick="switchSubCategory('houBi韻母')">4个后鼻韵母 :<br>ang eng ing ong</button>
            <button class="sub-btn" onclick="switchSubCategory('zhi整体')">16个整体认读音节 :<br>zhi chi shi ri zi ci si yi wu yu ye yue yuan yin yun ying</button>
        </div>

        <!-- 游戏核心卡片 -->
        <div class="game-container" id="game-card">
            
            <!-- 0. 首页欢迎界面 -->
            <div id="home-box" class="home-container">
                <h1 class="home-title">🔥 欢迎来到拼音冒险岛 🔥</h1>
                <p class="home-subtitle">
                    小朋友你准备好了吗？<br>
                    请拿出我们<b>火龙队</b>的<b>好奇</b>、<b>毅力</b>与<b>勇气</b>的特质，<br>
                    出发去冒险吧！✨
                </p>
                <img src="dragon.png" alt="火龙队特质" class="dragon-img">
                <button class="start-btn" onclick="switchMode(1)">🚀 开始冒险！</button>
            </div>

            <!-- 6. 年级练习模式选择界面 -->
            <div id="grade-selection-box" class="hidden">
                <h2 id="grade-title" style="color: #16a34a; margin-top:0;">📚 年级特训区</h2>
                <p style="color: #475569; font-size: 16px;">请选择您想要进行的练习类型：</p>
                <div class="btn-group" style="flex-direction: column; width: 80%; margin: 20px auto;">
                    <button class="start-btn" style="background-color: #3b82f6;" onclick="startGradePractice(false)">随机拼字练习 (无声调)</button>
                    <button class="start-btn" style="background-color: #8b5cf6;" onclick="startGradePractice(true)">随机拼字练习 (加入声调)</button>
                </div>
            </div>

            <!-- 5. 自订字词设置界面 -->
            <div id="custom-setup-box" class="hidden">
                <h2 style="color: #16a34a; margin-top:0;">📝 自订字词特训区</h2>
                <p style="color: #475569; font-size: 15px;">请在下方输入本周要练习的字词（可用逗号、空格或换行分隔）：</p>
                <div class="custom-input-container">
                    <textarea id="custom-words-input" class="custom-textarea" placeholder="例如：苹果 香蕉 勇敢 毅力 拼音..."></textarea>
                    <button class="action-btn" onclick="startCustomPractice()">✨ 保存并开始练习</button>
                </div>
            </div>

            <!-- 1. 答题进行中界面 -->
            <div id="quiz-box" class="hidden">
                <div class="score-board">🚩 进度：第 <span id="current-index">1</span> / <span id="total-index">10</span> 题 | 正确：<span id="score">0</span> 题</div>
                <div class="mode-title" id="current-mode-name">随机拼字练习（无声调）</div>
                
                <div class="word-display-box">
                    <div class="word-display" id="word-target">眼睛</div>
                    <button class="audio-btn" onclick="speakCurrentWord()" title="播放发音">🔊</button>
                </div>
                
                <input type="text" id="pinyin-input" class="input-box" placeholder="在这里输入拼音..." autocomplete="off">
                <div id="feedback" class="feedback"></div>
            </div>

            <!-- 2. 10 题挑战结束结算与分析界面 -->
            <div id="result-box" class="hidden">
                <h2 style="font-size: 28px; color: #16a34a; margin-bottom: 5px;">🏆 挑战完成！</h2>
                <div style="font-size: 22px; font-weight: bold; margin: 10px 0; color: #334155;">
                    本次成绩：<span id="final-score" style="color: #2563eb; font-size: 32px;">0/10</span>
                </div>

                <div class="analysis-box">
                    <h3 style="margin-top:0; color:#1e293b; font-size:18px;">📊 学习大冒险分析报告：</h3>
                    <div id="analysis-content"></div>
                </div>

                <p style="font-size: 18px; color: #475569; margin-bottom: 15px;">要继续挑战下一轮吗？</p>
                <div class="btn-group">
                    <button class="action-btn" onclick="restartChallenge()">是 (继续挑战)</button>
                    <button class="action-btn secondary" onclick="goHome()">否 (返回主页)</button>
                </div>
            </div>
        </div>
    </div>

            combined = [...rawGradeWords.G1, ...rawGradeWords.G2];
        } else if (gradeKey === 'G3') {
            combined = [...rawGradeWords.G1, ...rawGradeWords.G2, ...rawGradeWords.G3];
        } else if (gradeKey === 'G4') {
            combined = [...rawGradeWords.G1, ...rawGradeWords.G2, ...rawGradeWords.G3, ...rawGradeWords.G4];
        } else if (gradeKey === 'G5') {
            combined = [...rawGradeWords.G1, ...rawGradeWords.G2, ...rawGradeWords.G3, ...rawGradeWords.G4, ...rawGradeWords.G5];
        } else if (gradeKey === 'WLP_初级') {

            combined = [...rawGradeWords.WLP_初级, ...rawGradeWords.WLP_中级];
        } else if (gradeKey === 'WLP_高级') {
            combined = [...rawGradeWords.WLP_初级, ...rawGradeWords.WLP_中级, ...rawGradeWords.WLP_高级];

        return Array.from(new Set(combined)); // 过滤重复项

    function getPinyin(word, withTone) {
        if (typeof pinyinPro !== 'undefined') {
            if (withTone) {
                return pinyinPro.pinyin(word, { toneType: 'num', type: 'array' }).join('');
            } else {
                return pinyinPro.pinyin(word, { toneType: 'none', type: 'array' }).join('');
            }
        }
        return "";
    }

        }
        for (let py of pinyinCategories.qianBi) {
            if (cleanAns.includes(py)) return "前鼻韵母";
        }
        for (let py of pinyinCategories.fu) {
            if (cleanAns.includes(py)) return "复韵母";
        }
        for (let py of pinyinCategories.dan) {
            if (cleanAns.includes(py)) return "单韵母";
        }
        return "声母/拼读";
    }

    function showResult() {
        quizBoxEl.classList.add('hidden');
        resultBoxEl.classList.remove('hidden');
        finalScoreEl.innerText = `${score}/${maxQuestionsPerRound}`;

        if (currentSessionErrors.length === 0) {
            analysisContentEl.innerHTML = `
                <p style="color: #16a34a; font-weight: bold; font-size: 18px; margin: 10px 0;">
                    🌟 哇！太厉害了！全部答对！<br>
                    火龙队的好奇与勇气带你完美通关！保持这个状态继续加油！
                </p>
            `;
        } else {
            let stats = {};
            currentSessionErrors.forEach(item => {
                let cat = analyzePinyinCategory(item);
                stats[cat] = (stats[cat] || 0) + 1;
            });

            let sortedCats = Object.keys(stats).sort((a,b) => stats[b] - stats[a]);
            let topWeakness = sortedCats[0];

            let html = `<p style="font-size: 15px; color: #475569; margin-bottom: 10px;">本次练习中，小朋友主要在以下方面需要再加深印象：</p>`;
            
            sortedCats.forEach(cat => {
                html += `
                    <div class="analysis-item">
                        <span>• ${cat} 相关题目：</span>
                        <span class="analysis-tag">答错 ${stats[cat]} 次</span>
                    </div>
                `;
            });

            html += `
                <p style="background-color: #fef3c7; color: #b45309; padding: 10px; border-radius: 10px; font-weight: bold; margin-top: 15px; font-size: 15px;">
                    💡 小建议：小朋友在 <span style="text-decoration: underline; color: #d97706;">【${topWeakness}】</span> 上需要再加强喔！<br>
                    可以利用左侧的「特定声母、韵母练习」专门多练练它！
                </p>
            `;

            analysisContentEl.innerHTML = html;
        }
    }

    function restartChallenge() {
        resetChallenge();
        nextQuestion();
    }

    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const userInput = inputEl.value.toLowerCase().trim();
            const targetAnswer = currentQuestion.answer.toLowerCase().trim();

            if (userInput === targetAnswer) {
                if (wrongCount >= 3) {
                    feedbackEl.className = 'feedback correct';
                    feedbackEl.innerText = '👍 棒！跟着打对啰！进入下一题...';
                    inputEl.disabled = true;
                    setTimeout(nextQuestion, 1200);
                    return;
                }

                feedbackEl.className = 'feedback correct';
                feedbackEl.innerText = '🎉 太棒了！答对啰！';
                score++;
                scoreEl.innerText = score;

                if (currentMode === 4) {
                    wrongList = wrongList.filter(item => !(item.word === currentQuestion.word && item.answer === currentQuestion.answer));
                }
                
                inputEl.disabled = true;
                setTimeout(nextQuestion, 1000);
            } else {
                wrongCount++;
                inputEl.value = '';

                if (wrongCount === 1) {
                    currentSessionErrors.push(currentQuestion);
                }

                if (wrongCount < 3) {
                    feedbackEl.className = 'feedback wrong';
                    feedbackEl.innerText = `❌ 答错啰 (${wrongCount}/3 次)，再试一次看看！`;
                } else {
                    feedbackEl.className = 'feedback wrong';
                    feedbackEl.innerHTML = `
                        <div>💡 答错 3 次啰！正确答案是: <strong>${targetAnswer}</strong></div>
                        <div style="font-size: 15px; color: #7f1d1d;">✏️ 请看着上面的正确答案，在框内打一次并按 Enter 练习：</div>
                    `;
                    inputEl.focus();

                    const alreadyIn = wrongList.some(item => item.word === currentQuestion.word && item.answer === targetAnswer);
                    if (!alreadyIn && currentMode !== 4) {
                        wrongList.push({ word: currentQuestion.word, answer: targetAnswer, category: currentQuestion.category });
                    }
                }
            }
        }
    });

    goHome();
</script>
</body>
</html>
